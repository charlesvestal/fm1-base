# SPDX-License-Identifier: MPL-2.0
# Known vulnerabilities accepted in the build image (tools/toolchain.lock build-image), for
# tools/osv_scan.sh --config. Each is in a distroless base package (glibc, the gcc-14 runtime libraries, zlib, openssl) with no
# fix in Debian 13 yet (only in unstable); distroless rebuilds when Debian ships one. Exposure: the container has no
# network, no capabilities, a read-only root (busybox is its one shell, the keep-alive), and runs only JieLi's compiler on this repository's sources.
# Every entry expires: after ignoreUntil the scan fails again, so each is re-checked (update the digest first).

[[IgnoredVulns]]
